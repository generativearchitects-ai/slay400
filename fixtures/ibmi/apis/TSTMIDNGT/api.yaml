  ISOHIGH: { direction: response, name: isoHigh }
  HMSECHO: { direction: response, name: hmsEcho }
  HMSLOW: { direction: response, name: hmsLow }
  HMSHIGH: { direction: response, name: hmsHigh }
  USAECHO: { direction: response, name: usaEcho }
  USAECHO2: { direction: response, name: usaEcho2 }
  USALOW: { direction: response, name: usaLow }
  USAHIGH: { direction: response, name: usaHigh }
