program: TSTMEMBER
pcml: TSTMEMBER.pcml
route: /groups
method: GET
version: 1.0.0
summary: Returns four groups, each filled to its own count (invented test program)

parameters:
  FILL1: { name: fill1, type: integer, required: true }
  FILL2: { name: fill2, type: integer, required: true }
  FILL3: { name: fill3, type: integer, required: true }
  FILL4: { name: fill4, type: integer, required: true }
  GROUPS:
    direction: response
    name: groups
    fields:
      N: { name: count, type: integer }
      ITEMS:
        name: items
        trim: { countField: N }
