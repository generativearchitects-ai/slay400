program: TSTCOUNTS
pcml: TSTCOUNTS.pcml
route: /counts
method: GET
version: 1.0.0
summary: Returns the number of items and lines asked for (invented test program)

parameters:
  WANTED: { name: wanted, type: integer, required: true }
  COUNT: { direction: internal }
  ITEMS:
    direction: response
    name: items
    trim: { countField: COUNT }
  BOX:
    direction: response
    name: box
    fields:
      N: { name: count, type: integer }
      LINES:
        name: lines
        trim: { countField: N }
