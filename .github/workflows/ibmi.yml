name: ibmi

# Tests against a real IBM i (gateway kickoff 03). Never part of the default build or CI.
# Runs only when started by hand, or when a pull request from this repository gets the label "ibmi"; never for a fork.
# The job runs in the GitHub environment "ibmi", which the owner protects with a required reviewer and where the owner keeps
# IBMI_HOST, IBMI_USER, IBMI_PASSWORD and IBMI_LIBRARY as secrets. The system is shared: one run at a time, a handful of calls.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ibmi
  cancel-in-progress: false

jobs:
  ibmi:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ibmi' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ibmi
    timeout-minutes: 30
    env:
      IBMI_HOST: ${{ secrets.IBMI_HOST }}
      IBMI_USER: ${{ secrets.IBMI_USER }}
      IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
      IBMI_LIBRARY: ${{ secrets.IBMI_LIBRARY }}
    steps:
      # Secrets are masked by GitHub; their upper- and lower-case forms, which the IBM i writes in messages, are masked here.
      - name: Mask the forms of the values
        shell: bash
        run: |
          for value in "$IBMI_HOST" "$IBMI_USER" "$IBMI_LIBRARY"; do
            echo "::add-mask::${value^^}"
            echo "::add-mask::${value,,}"
          done
      - name: Check that the values are set
        shell: bash
        run: |
          for name in IBMI_HOST IBMI_USER IBMI_PASSWORD IBMI_LIBRARY; do
            if [ -z "${!name}" ]; then echo "$name is not set in the environment ibmi"; exit 1; fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          # No build cache: this job holds the secrets of the test system.
      - name: Build without tests
        run: ./mvnw -B -DskipTests install
      - name: Setup tool (copy, compile, bring back the PCML)
        run: ./mvnw -B -Pibmi -pl gateway-ibmi verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=IbmiSetupIT
      - name: Spike (Document and Raw)
        # Also after a failed setup step, so that a run that brings new PCML back also brings their bytes.
        if: ${{ !cancelled() }}
        run: ./mvnw -B -Pibmi -pl gateway-ibmi verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=SpikeIT
      - name: Probe of the programs of kickoff 05
        if: ${{ !cancelled() }}
        run: ./mvnw -B -Pibmi -pl gateway-ibmi verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=ProbeIT
      - name: The gateway over HTTP
        # Also after a failed setup step, so that a run that brings new PCML back also brings their bytes.
        if: ${{ !cancelled() }}
        run: ./mvnw -B -Pibmi -pl gateway-server verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=GatewayIT
      - name: The distribution, with JTOpen supplied as the README says (kickoff 10)
        # The distribution holds no JTOpen (decision 143): it is downloaded and checked with the two commands of the README,
        # into lib/ext, then the gateway is started with its launcher and makes one call to the system.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          tar -xzf gateway-server/target/slay400-gateway-*.tar.gz -C "$WORK"
          GATEWAY=$(echo "$WORK"/slay400-gateway-*)
          cd "$GATEWAY"
          curl -fLo lib/ext/jt400-21.0.7.jar https://repo1.maven.org/maven2/net/sf/jt400/jt400/21.0.7/jt400-21.0.7.jar
          echo "d2c06bba78d20b4733a3fabc9fe6ccabac337f7298bea95c6766108fa0b420f8  lib/ext/jt400-21.0.7.jar" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          ./mvnw -B -q -f fixtures/ibmi/pom.xml package -Dpcml.attach=false -Dpcml.bundleFile="$WORK/ibmi.rpgapi"
          cat > "$WORK/gateway.yaml" <<'YAML'
          server: { port: 18080 }
          management: { port: 19090 }
          reload: { intervalSeconds: 0 }
          tenants:
            acme:
              bundles: [./ibmi.rpgapi]
              environments:
                test:
                  code: T0001
                  backend: ibmi
                  host: ${IBMI_HOST}
                  libraryList: ["${IBMI_LIBRARY}"]
                  credentials: { user: "${IBMI_USER}", password: "${IBMI_PASSWORD}" }
                  pool: { maxConnections: 1 }
          YAML
          "$GATEWAY/bin/slay400-gateway" check --config "$WORK/gateway.yaml"
          "$GATEWAY/bin/slay400-gateway" run --config "$WORK/gateway.yaml" > "$WORK/out.log" 2> "$WORK/err.log" &
          PID=$!
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:19090/health/ready && break; sleep 1; done
          grep '"event":"started"' "$WORK/out.log"
          grep -q '"jt400":"21.0.7"' "$WORK/out.log"
          STATUS=$(curl -s -o "$WORK/answer.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"text":"HELLO","packed":"-12.34","zoned":42,"whole":-7}' http://127.0.0.1:18080/acme/test/scalars)
          echo "POST /acme/test/scalars -> $STATUS $(cat "$WORK/answer.json")"
          kill -TERM "$PID"
          wait "$PID" || true
          [ "$STATUS" = 200 ]
      - name: The documentation example that needs IBM i (gateway kickoff 09)
        # Runs docs/examples/call-a-program-on-ibm-i as the page shows it, with the regions marked "requires: ibmi", except
        # compile (the setup tool above compiled TSTNESTED), credentials (the secrets are already set) and sign-on-refused
        # (recorded by SignOnRefusedRecordingTest with a fake connection, kickoff 11). Signs on once and makes three calls. Every value of the system is written as the page's placeholder,
        # and the recorder fails without writing if one is left. The recordings are uploaded as ibmi-docs-recordings.
        if: ${{ !cancelled() }}
        run: |
          SLAY400_CORE_ARCHIVE="$(ci/core-archive.sh "$RUNNER_TEMP/slay400-core")"
          export SLAY400_CORE_ARCHIVE
          python3 ci/record_ibmi_example.py call-a-program-on-ibm-i --skip compile,credentials,sign-on-refused
      - name: Keep the recordings of the documentation example
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ibmi-docs-recordings
          path: docs/examples/call-a-program-on-ibm-i/expected
          if-no-files-found: error
          retention-days: 7
      - name: Keep the compiler's PCML, the differences and the spike report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ibmi-results
          path: gateway-ibmi/target/ibmi
          if-no-files-found: ignore
          retention-days: 7
