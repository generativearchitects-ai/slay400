name: ibmi

# Tests against a real IBM i (gateway kickoff 03). Never part of the default build or CI.
# Runs only when started by hand, or when a pull request from this repository gets the label "ibmi"; never for a fork.
# The job runs in the GitHub environment "ibmi", which the owner protects with a required reviewer and where the owner keeps
# IBMI_HOST, IBMI_USER, IBMI_PASSWORD and IBMI_LIBRARY as secrets. The system is shared: one run at a time, a handful of calls.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ibmi
  cancel-in-progress: false

jobs:
  ibmi:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ibmi' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ibmi
    timeout-minutes: 30
    env:
      IBMI_HOST: ${{ secrets.IBMI_HOST }}
      IBMI_USER: ${{ secrets.IBMI_USER }}
      IBMI_PASSWORD: ${{ secrets.IBMI_PASSWORD }}
      IBMI_LIBRARY: ${{ secrets.IBMI_LIBRARY }}
    steps:
      # Secrets are masked by GitHub; their upper- and lower-case forms, which the IBM i writes in messages, are masked here.
      - name: Mask the forms of the values
        shell: bash
        run: |
          for value in "$IBMI_HOST" "$IBMI_USER" "$IBMI_LIBRARY"; do
            echo "::add-mask::${value^^}"
            echo "::add-mask::${value,,}"
          done
      - name: Check that the values are set
        shell: bash
        run: |
          for name in IBMI_HOST IBMI_USER IBMI_PASSWORD IBMI_LIBRARY; do
            if [ -z "${!name}" ]; then echo "$name is not set in the environment ibmi"; exit 1; fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build without tests
        run: ./mvnw -B -DskipTests install
      - name: Setup tool (copy, compile, bring back the PCML)
        run: ./mvnw -B -Pibmi -pl gateway-ibmi verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=IbmiSetupIT
      - name: Spike (Document and Raw)
        run: ./mvnw -B -Pibmi -pl gateway-ibmi verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=SpikeIT
      - name: The gateway over HTTP
        run: ./mvnw -B -Pibmi -pl gateway-server verify -Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=GatewayIT
      - name: Keep the compiler's PCML, the differences and the spike report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ibmi-results
          path: gateway-ibmi/target/ibmi
          if-no-files-found: ignore
