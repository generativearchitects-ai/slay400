name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  # Mutation analysis of gateway-runtime: PIT changes the production code in small ways and the tests must notice.
  # Fails if fewer than ${mutation.threshold} percent (see pom.xml) of the mutants are killed.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Mutation tests
        run: ./mvnw -B -Pmutation verify
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pit-reports
          path: '*/target/pit-reports'
          if-no-files-found: ignore

  # The container image (kickoff 08): built from the distribution of the Maven build and tested here. It is never pushed:
  # publishing an image is the owner's decision (decision 130). No registry login and no secret.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the distribution
        run: ./mvnw -B package -DskipTests
      - name: Build the image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t gateway:ci .
      - name: Test the image
        run: ci/container-test.sh
